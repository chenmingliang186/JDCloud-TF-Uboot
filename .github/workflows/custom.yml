name: Build customized u-boot

on:
  workflow_dispatch:
    inputs:
      flash:
        description: 'Flash Type'
        required: true
        type: choice
        options:
        - 'NOR'
        - 'NAND'
        - 'NAND-NMBM'
      mtdparts:
        description: 'MTD Partition Table'
        required: true
        type: string
        default: '192k(u-boot),64k(u-boot-env),64k(factory),-(firmware)'
      kernel_offset:
        description: 'Kernel Load Address'
        required: true
        type: string
        default: '0x50000'
      reset_pin:
        description: 'Reset Button GPIO'
        required: true
        type: number
        default: -1
      sysled_pin:
        description: 'System LED GPIO'
        required: true
        type: number
        default: -1
      cpufreq:
        description: 'CPU Frequency (400 - 1200)'
        required: true
        type: number
        default: '880'
      ramfreq:
        description: 'DRAM Frequency'
        required: true
        type: choice
        options:
        - '400'
        - '800'
        - '1066'
        - '1200'
        default: '800'
      ddrparam:
        description: 'Prefered DDR Init Parameters'
        required: true
        type: choice
        options:
        - 'DDR2-64MiB'
        - 'DDR2-128MiB'
        - 'DDR2-W9751G6KB-64MiB-1066MHz'
        - 'DDR2-W971GG6KB25-128MiB-800MHz'
        - 'DDR2-W971GG6KB18-128MiB-1066MHz'
        - 'DDR3-128MiB'
        - 'DDR3-256MiB'
        - 'DDR3-512MiB'
        - 'DDR3-128MiB-KGD'
      oldparam:
        description: 'Use Old DDR Timing Parameters'
        required: true
        type: boolean
        default: false
      baudrate:
        description: 'Baud Rate'
        required: true
        type: choice
        options:
        - '57600'
        - '115200'

jobs:
  build:
    name: Build MT7621 u-boot
    runs-on: ubuntu-latest
    strategy:
       fail-fast: False

    steps:
      - name: Checkout master directory
        uses: actions/checkout@v5
        with:
          path: uboot-mt7621

      - name: Install essential packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex bc libssl-dev python3

      - name: Download OpenWrt toolchain
        run: |
          curl --fail --location --retry 3 -o toolchain.tar.xz \
            https://github.com/DragonBluep/uboot-mt7621/releases/download/20230517/openwrt-toolchain-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          echo 'eea24cfa6b586fab28994bc4b9f485401dd75fde2707febf6ec823ab4e68ccf4  toolchain.tar.xz' | sha256sum -c -
          tar -xJf toolchain.tar.xz

      - name: Set old DDR timing parameters
        if:  ${{ inputs.oldparam }}
        working-directory: uboot-mt7621
        run: sed -i 's/0x0C000000/0x0A000000/g' ./arch/mips/mach-mt7621/dramc-legacy/dramc.S

      - name: Compile
        working-directory: uboot-mt7621
        env:
          FLASH: ${{ inputs.flash }}
          MTDPARTS: ${{ inputs.mtdparts }}
          KERNEL_OFFSET: ${{ inputs.kernel_offset }}
          RESET_PIN: ${{ inputs.reset_pin }}
          SYSLED_PIN: ${{ inputs.sysled_pin }}
          CPUFREQ: ${{ inputs.cpufreq }}
          RAMFREQ: ${{ inputs.ramfreq }}
          DDRPARAM: ${{ inputs.ddrparam }}
          BAUDRATE: ${{ inputs.baudrate }}
        run: |
          bash ./customize.sh "$FLASH" "$MTDPARTS" "$KERNEL_OFFSET" "$RESET_PIN" \
            "$SYSLED_PIN" "$CPUFREQ" "$RAMFREQ" "$DDRPARAM" "$BAUDRATE"


      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: u-boot
          path: "uboot-mt7621/archive/"
